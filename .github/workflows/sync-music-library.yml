name: Sync MP3 music library

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - "**/*.mp3"
      - ".github/workflows/sync-music-library.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-library-main
  cancel-in-progress: false

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout music repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan repository and generate tracks.json
        shell: python
        run: |
          import json
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime, timezone

          repo = "zhaxuan92-star/Kho-r-c-"
          branch = "main"
          tracks = []
          files = sorted(
              (
                  p for p in Path(".").rglob("*")
                  if p.is_file()
                  and p.suffix.lower() == ".mp3"
                  and ".git" not in p.parts
              ),
              key=lambda p: p.as_posix().casefold()
          )

          for index, path in enumerate(files, start=1):
              relative_path = path.as_posix().removeprefix("./")
              tracks.append({
                  "id": f"music-{index:04d}",
                  "title": path.stem,
                  "artist": "Unknown",
                  "file": relative_path,
                  "url": f"https://raw.githubusercontent.com/{repo}/{branch}/{quote(relative_path, safe='/')}",
                  "approved": True
              })

          manifest = {
              "version": 4,
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": f"https://github.com/{repo}",
              "rightsNotice": f"https://github.com/{repo}/blob/{branch}/VZCMUSICO-COPYRIGHT.md",
              "approvalMeaning": "approved means included in the playback catalogue only; it is not copyright clearance",
              "tracks": tracks
          }
          Path("tracks.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Generated manifest with {len(tracks)} MP3 track(s).")

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracks.json
          if git diff --cached --quiet; then
            echo "tracks.json is already up to date."
          else
            git commit -m "chore(music): sync MP3 library manifest"
            git push
          fi
