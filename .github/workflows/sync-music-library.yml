name: Sync MP3 music library

on:
  push:
    branches:
      - main
    paths:
      - "*.mp3"
      - ".github/workflows/sync-music-library.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-library-main
  cancel-in-progress: false

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout music repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate tracks.json from root MP3 files
        shell: python
        run: |
          import json
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime, timezone

          repo = "zhaxuan92-star/Kho-r-c-"
          branch = "main"
          tracks = []
          files = sorted(
              (p for p in Path(".").iterdir() if p.is_file() and p.suffix.lower() == ".mp3"),
              key=lambda p: p.name.casefold()
          )

          for index, path in enumerate(files, start=1):
              filename = path.name
              tracks.append({
                  "id": f"music-{index:04d}",
                  "title": path.stem,
                  "artist": "Unknown",
                  "file": filename,
                  "url": f"https://raw.githubusercontent.com/{repo}/{branch}/{quote(filename, safe='')}",
                  "approved": True
              })

          manifest = {
              "version": 3,
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": f"https://github.com/{repo}",
              "tracks": tracks
          }
          Path("tracks.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )
          print(f"Generated manifest with {len(tracks)} MP3 track(s).")

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracks.json
          if git diff --cached --quiet; then
            echo "tracks.json is already up to date."
          else
            git commit -m "chore(music): sync MP3 library manifest"
            git push
          fi
